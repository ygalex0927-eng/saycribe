[package]
name = "saycribe-core"
version = "0.1.0"
edition = "2021"
description = "Saycribe 跨平台共享核心：SenseVoice 识别、Silero VAD 分段、中转客户端、配置/历史/词典/语气映射"
license = "UNLICENSED"
publish = false

[lib]
name = "saycribe_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["asr"]
# 本地识别（sherpa-onnx，构建时自动下载预编译库：macOS arm64/x64、Linux x86_64/aarch64、Windows x64）
asr = ["dep:sherpa-onnx"]

[dependencies]
sherpa-onnx = { version = "=2.0.1", optional = true, default-features = false, features = ["static"] }
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tar = "0.4"
bzip2 = "0.4"

[dev-dependencies]
tempfile = "3"

[[example]]
name = "saycribe-cli"
required-features = ["asr"]
