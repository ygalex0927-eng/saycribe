# ENABLED 2026-10-30: saycribe relay, cert via certbot webroot (/var/www/html)
server {
    listen 80;
    listen [::]:80;
    server_name saycribe-api.motomotos.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name saycribe-api.motomotos.com;
    ssl_certificate     /etc/letsencrypt/live/saycribe-api.motomotos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saycribe-api.motomotos.com/privkey.pem;
    keepalive_timeout 120s;
    client_max_body_size 64k;
    location /v1/admin/ { allow 127.0.0.1; deny all; proxy_pass http://127.0.0.1:18780; }
    location / {
        proxy_pass http://127.0.0.1:18780;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
